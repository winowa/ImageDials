name: Cross-platform checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Configure portable defaults
        run: python -c "import shutil; shutil.copyfile('.env.example', '.env')"
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Install backend
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: Shared quality gates
        run: python scripts/ci.py
