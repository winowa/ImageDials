[project]
name = "imagedials"
version = "0.0.0"
description = "Image prompt controls and generation workspace"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi==0.162.0",
    "pillow==12.0.0",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.2.0", "ruff==0.17.3", "uv==0.11.25"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".local", "docs/plans", ".agents", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
